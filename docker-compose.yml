# Mongo, a local copy of the demo shop, a one-shot crawl and the API.
#
# The crawl targets the demo shop by default so that `docker compose up` works
# offline and gives the same data every time. Point BASE_URL at
# https://books.toscrape.com/ to crawl the public sandbox instead.
services:
  mongo:
    image: mongo:8.2
    restart: unless-stopped
    # Not published to the host: nothing outside this network needs it, and
    # 27017 is a common local port to collide with.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  shop:
    build: &build { context: ., dockerfile: Dockerfile }
    image: books-monitor:local
    # Serves demo/site: /v1/ is the first edition, /v2/ the day after.
    command: ["python", "-m", "http.server", "8080", "--directory", "demo/site"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/')"]
      interval: 5s
      timeout: 3s
      retries: 12

  crawl:
    build: *build
    image: books-monitor:local
    command: ["python", "-m", "app.crawler.runner"]
    environment: &env
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: books_monitor
      BASE_URL: ${BASE_URL:-http://shop:8080/v1/}
      API_KEYS: ${API_KEYS:-dev-key-1}
      # The API runs its own scheduler by default; with a dedicated crawl job
      # that would mean two crawlers racing over the same collection.
      RUN_SCHEDULER_IN_API: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongo: { condition: service_healthy }
      shop: { condition: service_healthy }

  api:
    build: *build
    image: books-monitor:local
    environment: *env
    ports: ["8800:8000"]
    depends_on:
      mongo: { condition: service_healthy }
      crawl: { condition: service_completed_successfully }
    healthcheck:
      # /health needs an API key like every other route, so the check sends
      # the first configured key rather than the endpoint being opened up.
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health',
          headers={'X-API-Key': os.environ['API_KEYS'].split(',')[0]}))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  mongo-data:
